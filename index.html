<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteio · Heloísa &amp; Lênio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="chapel-motif" aria-hidden="true">
        <svg viewBox="0 0 220 170" xmlns="http://www.w3.org/2000/svg">
          <path d="M110 12 L150 78 L70 78 Z" />
          <line x1="110" y1="12" x2="110" y2="0" />
          <line x1="103" y1="6" x2="117" y2="6" />
          <rect x="62" y="78" width="96" height="60" />
          <path d="M100 138 v-26 a10 10 0 0 1 20 0 v26" />
          <path d="M20 138 q0 -34 14 -50 q4 20 0 50 M34 96 q10 -8 18 -6 M28 106 q12 -6 20 -2 M20 124 q14 -8 24 -4" />
          <path d="M200 138 q0 -34 -14 -50 q-4 20 0 50 M186 96 q-10 -8 -18 -6 M192 106 q-12 -6 -20 -2 M200 124 q-14 -8 -24 -4" />
          <line x1="8" y1="138" x2="212" y2="138" />
        </svg>
      </div>

      <p class="logo">Heloísa <span class="e">e</span> Lênio</p>
      <h1>Sorteio</h1>

      <nav class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="classico" role="tab" aria-selected="true">Convidados</button>
        <button class="tab-btn" data-tab="roleta" role="tab" aria-selected="false">Padrinhos</button>
      </nav>
    </header>

    <main>
      <!-- CLÁSSICO -->
      <section id="classico" class="tab-panel active">
        <div class="card">
          <h2>Intervalos</h2>
          <div id="intervals-list" class="intervals-list"></div>
          <button id="add-interval" class="btn btn-secondary">+ Adicionar intervalo</button>

          <label class="toggle-row">
            <input type="checkbox" id="allow-repeat">
            <span>Permitir repetição de números já sorteados</span>
          </label>

          <button id="draw-number" class="btn btn-primary btn-big">Sortear número</button>

          <div class="result-box" id="classic-result">
            <span class="result-placeholder">Aguardando sorteio…</span>
          </div>

          <div class="history-box">
            <div class="history-header">
              <h3>Histórico</h3>
              <button id="reset-classic" class="btn btn-ghost">Limpar</button>
            </div>
            <ul id="classic-history" class="history-list"></ul>
          </div>
        </div>
      </section>

      <!-- ROLETA -->
      <section id="roleta" class="tab-panel">
        <div class="card roleta-card">
          <div class="roleta-layout">
            <div class="wheel-area">
              <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheel-canvas" width="420" height="420"></canvas>
              </div>
              <button id="spin-btn" class="btn btn-primary btn-big">Girar roleta</button>
              <div class="result-box" id="roleta-result">
                <span class="result-placeholder">Aguardando sorteio…</span>
              </div>
            </div>

            <div class="options-area">
              <h2>Opções</h2>
              <div class="add-option-row">
                <input type="text" id="option-input" placeholder="Digite um nome e Enter">
                <button id="add-option" class="btn btn-secondary">Adicionar</button>
              </div>
              <textarea id="bulk-input" placeholder="Ou cole vários nomes aqui, um por linha…" rows="3"></textarea>
              <button id="add-bulk" class="btn btn-secondary">Adicionar lista</button>

              <ul id="options-list" class="options-list"></ul>

              <label class="toggle-row">
                <input type="checkbox" id="eliminate-toggle">
                <span>Remover da roda após sortear (eliminatória)</span>
              </label>

              <div class="history-box">
                <div class="history-header">
                  <h3>Histórico</h3>
                  <button id="reset-roleta" class="btn btn-ghost">Restaurar lista original</button>
                </div>
                <ul id="roleta-history" class="history-list"></ul>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
<script src="script.js"></script>
</body>
</html>
